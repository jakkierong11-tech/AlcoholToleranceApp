name: AlcoholToleranceApp
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  AlcoholToleranceApp:
    type: application
    platform: iOS
    sources:
      - path: AlcoholToleranceApp
        excludes:
          - "**/.DS_Store"
      - path: .
        includes:
          - "AlcoholToleranceApp.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alcoholtolerance.app
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        ENABLE_TESTABILITY: YES
    dependencies: []

  AlcoholToleranceAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AlcoholToleranceAppTests
        excludes:
          - "EmptyTest.swift"
          - "**/.DS_Store"
    dependencies:
      - target: AlcoholToleranceApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alcoholtolerance.app.tests
