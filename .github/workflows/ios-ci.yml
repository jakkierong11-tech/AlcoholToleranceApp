name: iOS CI — Build & Test

on:
  push:
    branches: [master, main]
    paths:
      - 'AlcoholToleranceApp/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: cd AlcoholToleranceApp && rm -rf AlcoholToleranceApp.xcodeproj && xcodegen generate

      - name: Build
        run: |
          cd AlcoholToleranceApp
          xcodebuild build \
            -project AlcoholToleranceApp.xcodeproj \
            -scheme AlcoholToleranceApp \
            -destination 'platform=iOS Simulator,name=Any iOS Simulator Device' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Test
        run: |
          cd AlcoholToleranceApp
          xcodebuild test \
            -project AlcoholToleranceApp.xcodeproj \
            -scheme AlcoholToleranceApp \
            -destination 'platform=iOS Simulator,name=Any iOS Simulator Device' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package & Upload Appetize
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          if [ -z "$APPETIZE_TOKEN" ]; then echo "SKIP: no token"; exit 0; fi
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'AlcoholToleranceApp.app' -type d 2>/dev/null | head -1)
          [ -z "$APP" ] && APP=$(find /tmp -name 'AlcoholToleranceApp.app' -type d 2>/dev/null | head -1)
          [ -z "$APP" ] && echo "ERROR: .app not found" && exit 1
          echo "Found: $APP"
          cd "$(dirname "$APP")" && zip -r /tmp/app.zip "$(basename "$APP")"
          RESP=$(curl -s -X POST https://api.appetize.io/v1/apps -H "Authorization: $APPETIZE_TOKEN" -F "file=@/tmp/app.zip" -F "platform=ios" -F "timeout=300")
          echo "$RESP"
          KEY=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('publicKey',''))" 2>/dev/null)
          [ -n "$KEY" ] && echo "✅ https://appetize.io/app/$KEY" && echo "appetize_url=https://appetize.io/app/$KEY" >> $GITHUB_OUTPUT

      - name: Notify Discord
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APPETIZE_URL: ${{ steps.appetize.outputs.appetize_url }}
        run: |
          [ -z "$WEBHOOK" ] && echo "SKIP: no webhook" && exit 0
          curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "{\"content\":\"$( [ -n \"$APPETIZE_URL\" ] && echo \"🎮 Appetize: $APPETIZE_URL\" || echo \"CI done: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\" )\"}"
