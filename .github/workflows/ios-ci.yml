name: iOS CI — Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'AlcoholToleranceApp/**'
  pull_request:
    branches: [main]
    paths:
      - 'AlcoholToleranceApp/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: 编译 + 测试
    runs-on: macos-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 选 Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 .xcodeproj
        working-directory: AlcoholToleranceApp
        run: xcodegen generate

      - name: 编译 App
        id: build
        working-directory: AlcoholToleranceApp
        run: |
          xcodebuild build \
            -project AlcoholToleranceApp.xcodeproj \
            -scheme AlcoholToleranceApp \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
        continue-on-error: true

      - name: 运行单元测试
        id: test
        if: steps.build.outcome == 'success'
        working-directory: AlcoholToleranceApp
        run: |
          xcodebuild test \
            -project AlcoholToleranceApp.xcodeproj \
            -scheme AlcoholToleranceApp \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
        continue-on-error: true

      - name: 通知 Discord
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          BUILD_OUTCOME="${{ steps.build.outcome }}"
          TEST_OUTCOME="${{ steps.test.outcome }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$BUILD_OUTCOME" = "success" ] && [ "$TEST_OUTCOME" = "success" ]; then
            TITLE="✅ CI 通过 — AlcoholToleranceApp"
            COLOR=65280
            BUILD_LINE="✅ 编译通过"
            TEST_LINE="✅ 测试通过"
          else
            TITLE="❌ CI 失败 — AlcoholToleranceApp"
            COLOR=16711680
            BUILD_LINE="$([ "$BUILD_OUTCOME" = "success" ] && echo '✅ 编译通过' || echo '❌ 编译失败')"
            TEST_LINE="$([ "$TEST_OUTCOME" = "success" ] && echo '✅ 测试通过' || [ "$TEST_OUTCOME" = "skipped" ] && echo '⏭️ 跳过' || echo '❌ 测试失败')"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "$TITLE",
              "color": $COLOR,
              "fields": [
                {"name": "📦 编译", "value": "$BUILD_LINE", "inline": true},
                {"name": "🧪 测试", "value": "$TEST_LINE", "inline": true},
                {"name": "🔗 详情", "value": "[查看 Actions]($RUN_URL)"}
              ],
              "footer": {"text": "${{ github.sha }}"}
            }]
          }
          EOF
          )

          echo "$PAYLOAD" > /tmp/discord.json
          curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d @/tmp/discord.json
          echo ""
          echo "Discord 通知已发送"
