name: iOS CI — Build & Test

on:
  push:
    branches: [master, main]
    paths:
      - 'AlcoholToleranceApp/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 xcodeproj
        run: cd AlcoholToleranceApp && rm -rf AlcoholToleranceApp.xcodeproj && xcodegen generate

      - name: 检查可用模拟器
        run: |
          echo "=== Runtimes ==="
          xcrun simctl list runtimes | head -10
          echo "=== Available iPhone Devices ==="
          xcrun simctl list devices available | grep "iPhone 16" | head -3

      - name: 编译（不含测试）
        run: |
          cd AlcoholToleranceApp
          xcodebuild build-for-testing \
            -project AlcoholToleranceApp.xcodeproj \
            -scheme AlcoholToleranceApp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: 运行测试
        run: |
          xcrun simctl boot 'iPad (10th generation)' || true
          sleep 5
          cd AlcoholToleranceApp
          xcodebuild test-without-building \
            -project AlcoholToleranceApp.xcodeproj \
            -scheme AlcoholToleranceApp \
            -destination 'platform=iOS Simulator,name=iPad (10th generation)' \
            -configuration Debug \
            -resultBundlePath ../test-results.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          xcrun simctl shutdown 'iPad (10th generation)' || true

      - name: 打包并上传 Appetize.io
        id: appetize
        continue-on-error: true
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          [ -z "$APPETIZE_TOKEN" ] && echo "SKIP: no token" && exit 0
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'AlcoholToleranceApp.app' -type d 2>/dev/null | head -1)
          [ -z "$APP" ] && echo "WARN: .app not found" && exit 0
          cd "$(dirname "$APP")" && zip -r /tmp/app.zip "$(basename "$APP")"
          RESP=$(curl -s -w '\n%{http_code}' -X POST https://api.appetize.io/v1/apps -H "Authorization: $APPETIZE_TOKEN" -F "file=@/tmp/app.zip" -F "platform=ios" -F "timeout=300")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then echo "WARN: Appetize upload failed (HTTP $HTTP_CODE) - 不影响 CI"; exit 0; fi
          BODY=$(echo "$RESP" | head -n -1)
          echo "$BODY"
          KEY=$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin).get('publicKey',''))" 2>/dev/null)
          [ -n "$KEY" ] && echo "✅ https://appetize.io/app/$KEY" && echo "appetize_url=https://appetize.io/app/$KEY" >> $GITHUB_OUTPUT

      - name: 保存 App 文件（备用下载）
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'AlcoholToleranceApp.app' -type d 2>/dev/null | head -1)
          [ -z "$APP" ] && echo "WARN: .app not found" && exit 0
          cd "$(dirname "$APP")" && zip -r /tmp/AlcoholToleranceApp-simulator.zip "$(basename "$APP")"
      - uses: actions/upload-artifact@v4
        with:
          name: AlcoholToleranceApp-simulator
          path: /tmp/AlcoholToleranceApp-simulator.zip

      - name: 通知 Discord
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APPETIZE_URL: ${{ steps.appetize.outputs.appetize_url }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          [ -n "$APPETIZE_URL" ] && MSG="🎮 Appetize: $APPETIZE_URL" || MSG="CI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "{\"content\":\"$MSG\"}"
