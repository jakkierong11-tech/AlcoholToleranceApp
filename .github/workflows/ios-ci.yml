name: iOS CI — Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'AlcoholToleranceApp/**'
  pull_request:
    branches: [main]
    paths:
      - 'AlcoholToleranceApp/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: 编译 + 测试
    runs-on: macos-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 选 Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 .xcodeproj
        working-directory: AlcoholToleranceApp
        run: xcodegen generate

      - name: 编译 App
        working-directory: AlcoholToleranceApp
        run: |
          xcodebuild build \
            -project AlcoholToleranceApp.xcodeproj \
            -scheme AlcoholToleranceApp \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 运行单元测试
        working-directory: AlcoholToleranceApp
        run: |
          xcodebuild test \
            -project AlcoholToleranceApp.xcodeproj \
            -scheme AlcoholToleranceApp \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
