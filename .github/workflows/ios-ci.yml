name: iOS CI — Build & Test

on:
  push:
    branches: [master, main]
    paths:
      - 'AlcoholToleranceApp/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 xcodeproj
        run: cd AlcoholToleranceApp && rm -rf AlcoholToleranceApp.xcodeproj && xcodegen generate

      - name: 检查可用模拟器
        run: |
          echo "=== Runtimes ==="
          xcrun simctl list runtimes
          echo "=== Device Types (iPhone) ==="
          xcrun simctl list devicetypes | grep iPhone | tail -5
          echo "=== Available Devices ==="
          xcrun simctl list devices available | head -20

      - name: 编译
        id: build
        continue-on-error: true
        run: |
          cd AlcoholToleranceApp
          xcodebuild build \
            -project AlcoholToleranceApp.xcodeproj \
            -scheme AlcoholToleranceApp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > xcodebuild.log 2>&1 || true
        shell: bash

      - name: 提取编译错误
        if: always()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -i "error:" AlcoholToleranceApp/xcodebuild.log || echo "no error: lines found"
          echo "=== BUILD FAILURES SUMMARY ==="
          grep -A5 -i "failures" AlcoholToleranceApp/xcodebuild.log || echo "no failures line"
          echo "=== LAST 30 LINES ==="
          tail -30 AlcoholToleranceApp/xcodebuild.log
        shell: bash

      - name: 中止（编译失败）
        if: steps.build.outcome == 'failure'
        run: exit 1
        shell: bash

      - name: 测试
        run: |
          cd AlcoholToleranceApp
          xcodebuild test \
            -project AlcoholToleranceApp.xcodeproj \
            -scheme AlcoholToleranceApp \
            -destination 'platform=iOS Simulator,name=Any iOS Simulator Device' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: 打包并上传 Appetize.io
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          [ -z "$APPETIZE_TOKEN" ] && echo "SKIP: no token" && exit 0
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'AlcoholToleranceApp.app' -type d 2>/dev/null | head -1)
          [ -z "$APP" ] && echo "ERROR: .app not found" && exit 1
          cd "$(dirname "$APP")" && zip -r /tmp/app.zip "$(basename "$APP")"
          RESP=$(curl -s -X POST https://api.appetize.io/v1/apps -H "Authorization: $APPETIZE_TOKEN" -F "file=@/tmp/app.zip" -F "platform=ios" -F "timeout=300")
          echo "$RESP"
          KEY=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('publicKey',''))" 2>/dev/null)
          [ -n "$KEY" ] && echo "✅ https://appetize.io/app/$KEY" && echo "appetize_url=https://appetize.io/app/$KEY" >> $GITHUB_OUTPUT

      - name: 通知 Discord
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APPETIZE_URL: ${{ steps.appetize.outputs.appetize_url }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          [ -n "$APPETIZE_URL" ] && MSG="🎮 Appetize: $APPETIZE_URL" || MSG="CI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "{\"content\":\"$MSG\"}"
